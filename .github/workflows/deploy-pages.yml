name: 部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 引擎单元测试
        run: node --test tests/engine.test.mjs tests/overrides.test.mjs

      - name: 组装静态站点
        run: |
          mkdir -p _site
          cp -r index.html ui engine data docs _site/
          # docs 里只有截图，供 README 引用；静态托管没有后端，服务端脚本不参与部署
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
